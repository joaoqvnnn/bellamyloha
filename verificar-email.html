<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>Verificando e-mail — STREAMLY</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/cadastro.css" />
</head>
<body class="auth-body">

  <main class="auth-shell">
    <a href="catalogo.html" class="auth-brand">
      <span class="brand-mark">S</span>
      <span class="brand-name">STREAMLY</span>
    </a>

    <div class="auth-card" id="verifyCard">
      <div class="verify-loading" id="loadingState">
        <div class="verify-spinner">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="9" opacity=".2"/>
            <path d="M21 12a9 9 0 0 0-9-9">
              <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.9s" repeatCount="indefinite"/>
            </path>
          </svg>
        </div>
        <h1>Confirmando seu e-mail...</h1>
        <p class="auth-sub">Aguarde um instante.</p>
      </div>
    </div>

    <p class="auth-legal">© 2025 STREAMLY</p>
  </main>

  <div class="toast-stack" id="toastStack"></div>

  <script src="js/verificar-email.js"></script>
</body>
</html>
