<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — STREAMLY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/cadastro.css" />
  <style>
    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 99px;
      background: rgba(229, 9, 20, .12);
      color: #ff5f68;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
  </style>
</head>
<body class="auth-body">
  <main class="auth-shell">
    <a href="catalogo.html" class="auth-brand">
      <span class="brand-mark">S</span>
      <span class="brand-name">STREAMLY</span>
    </a>

    <div class="auth-card">
      <div style="text-align: center;">
        <span class="admin-badge">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 4 6v6c0 5 3.5 9.5 8 11 4.5-1.5 8-6 8-11V6l-8-4Z"/></svg>
          Acesso restrito · Administração
        </span>
      </div>

      <h1 style="text-align: center;">Painel administrativo</h1>
      <p class="auth-sub" style="text-align: center;">Entre com suas credenciais de administrador.</p>

      <form id="adminLoginForm" novalidate>
        <div class="field" data-field="email">
          <label for="email">E-mail</label>
          <div class="input">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.6" y="5" width="18.8" height="14" rx="2.6"/><path d="m3.6 7.2 8.4 5.8 8.4-5.8"/></svg>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="admin@email.com" />
          </div>
          <span class="msg"></span>
        </div>

        <div class="field" data-field="password">
          <label for="password">Senha</label>
          <div class="input">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10" width="15" height="10.5" rx="2.6"/><path d="M8.2 10V7.6a3.8 3.8 0 0 1 7.6 0V10"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Sua senha" />
            <button type="button" class="eye" id="eyeBtn" aria-label="Mostrar senha">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.6 12 5.6 21.5 12 21.5 12 18 18.4 12 18.4 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="msg"></span>
        </div>

        <button type="submit" class="btn btn-primary auth-submit" id="submitBtn">
          <span id="submitText">Entrar no painel</span>
          <svg id="submitIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>

      <div class="auth-footer" style="justify-content: center;">
        <a href="login.html">Voltar ao login comum</a>
      </div>
    </div>

    <p class="auth-legal">© 2025 STREAMLY · Acesso administrativo monitorado</p>
  </main>

  <div class="toast-stack" id="toastStack"></div>

  <script>
    window.STREAMLY_API_BASE = window.STREAMLY_API_BASE || '/api';

    const API_BASE = window.STREAMLY_API_BASE;
    const $ = (s, c = document) => c.querySelector(s);

    const TOAST_ICONS = {
      success: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>',
      error:   '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg>',
      warn:    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.8 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17v.1"/></svg>',
    };
    function toast(msg, type = 'warn') {
      const stack = $('#toastStack');
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.innerHTML = `<span class="toast-icon">${TOAST_ICONS[type] || TOAST_ICONS.warn}</span><span>${msg}</span>`;
      stack.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3800);
    }

    $('#eyeBtn').addEventListener('click', () => {
      const i = $('#password');
      i.type = i.type === 'password' ? 'text' : 'password';
    });

    $('#adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('#email').value.trim();
      const password = $('#password').value;
      if (!email || !password) {
        toast('Informe e-mail e senha.', 'warn');
        return;
      }

      const btn = $('#submitBtn');
      btn.disabled = true;
      $('#submitText').textContent = 'Autenticando...';
      $('#submitIcon').innerHTML = '<circle cx="12" cy="12" r="9" stroke-dasharray="42 20" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.9s" repeatCount="indefinite"/></circle>';

      try {
        const res = await fetch(`${API_BASE}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Credenciais inválidas.');

        localStorage.setItem('streamly-admin-token', data.sessionToken);
        localStorage.setItem('streamly-admin-user', JSON.stringify(data.user));
        toast('Autenticado. Redirecionando...', 'success');
        setTimeout(() => { window.location.href = 'admin.html'; }, 700);
      } catch (err) {
        toast(err.message || 'Erro ao autenticar.', 'error');
        btn.disabled = false;
        $('#submitText').textContent = 'Entrar no painel';
        $('#submitIcon').innerHTML = '<path d="M5 12h14M13 6l6 6-6 6"/>';
      }
    });

    // Se já tem token de admin, redireciona
    if (localStorage.getItem('streamly-admin-token')) {
      window.location.href = 'admin.html';
    }
  </script>
</body>
</html>
