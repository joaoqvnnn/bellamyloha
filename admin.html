<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Painel Admin — STREAMLY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-body">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-brand">
      <span class="brand-mark">S</span>
      <div>
        <strong>STREAMLY</strong>
        <span>Admin</span>
      </div>
    </div>

    <nav class="admin-nav">
      <a href="#" class="admin-nav-item is-active" data-section="dashboard">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Dashboard
      </a>
      <a href="#" class="admin-nav-item" data-section="users">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4a4 4 0 0 1 0 8M22 21a6 6 0 0 0-6-6"/></svg>
        Usuários
      </a>
      <a href="#" class="admin-nav-item" data-section="products">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v3c0 1.1.9 2 2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9c1.1 0 2-.9 2-2Z"/><path d="M3 8h18M12 8v12"/></svg>
        Produtos
      </a>
      <a href="#" class="admin-nav-item" data-section="orders">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.5h14a1.5 1.5 0 0 1 1.5 1.5v16L17 19l-2.5 2-2.5-2-2.5 2-2.5-2L3.5 21V5A1.5 1.5 0 0 1 5 3.5Z"/><path d="M8 8.5h8M8 12.5h6"/></svg>
        Pedidos
      </a>
      <a href="#" class="admin-nav-item" data-section="transactions">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M17 8l-5-5-5 5M7 16l5 5 5-5"/></svg>
        Transações
      </a>
      <a href="#" class="admin-nav-item" data-section="screens">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        Telas
      </a>
      <a href="#" class="admin-nav-item" data-section="subscriptions">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.8 1 6.5 2.7"/><path d="M21 4v5h-5"/></svg>
        Assinaturas
      </a>
      <a href="#" class="admin-nav-item" data-section="tickets">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.5 7.4L3.5 20.5l1.6-5A8.4 8.4 0 1 1 21 11.5Z"/></svg>
        Suporte
        <span class="admin-badge" id="badgeTickets" hidden>0</span>
      </a>
      <a href="#" class="admin-nav-item" data-section="cpf">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.6" y="5" width="18.8" height="14" rx="2.6"/><circle cx="8.4" cy="11" r="2"/><path d="M5.4 16.3a3.2 3.2 0 0 1 6 0"/></svg>
        CPF
        <span class="admin-badge" id="badgeCpf" hidden>0</span>
      </a>
      <a href="#" class="admin-nav-item" data-section="recharge">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h11A2.5 2.5 0 0 1 19 7.5v1H5.5A2.5 2.5 0 0 0 3 11v6a2.5 2.5 0 0 0 2.5 2.5h13A2.5 2.5 0 0 0 21 17V9.5A2.5 2.5 0 0 0 18.5 7"/><circle cx="16.5" cy="13" r="1.4"/></svg>
        Recarga
      </a>
      <a href="#" class="admin-nav-item" data-section="site">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18M3 12h18"/></svg>
        Site institucional
      </a>
      <a href="#" class="admin-nav-item" data-section="notifications">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.5 21a2 2 0 0 0 3 0"/></svg>
        Notificações
      </a>
    </nav>

    <div class="admin-sidebar-footer">
      <a href="catalogo.html" class="admin-nav-item" target="_blank">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14 21 3"/></svg>
        Ver site
      </a>
      <button class="admin-nav-item is-danger" id="logoutBtn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>
        Sair
      </button>
    </div>
  </aside>

  <!-- ===================== MAIN ===================== -->
  <div class="admin-main">
    <header class="admin-topbar">
      <button class="admin-hamburger" id="adminHamburger" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="admin-topbar-title">
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSubtitle">Visão geral da plataforma</p>
      </div>
      <div class="admin-topbar-right">
        <div class="admin-user">
          <div class="admin-user-avatar">A</div>
          <div class="admin-user-info">
            <strong id="adminName">Admin</strong>
            <span id="adminEmail">admin@streamly</span>
          </div>
        </div>
      </div>
    </header>

    <div class="admin-content" id="adminContent">
      <!-- Renderizado via JS -->
    </div>
  </div>

  <!-- Overlay mobile -->
  <div class="admin-overlay" id="adminOverlay" hidden></div>

  <!-- Modal genérico -->
  <div class="modal" id="adminModal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel" role="dialog" aria-modal="true">
      <button class="modal-close" data-close-modal aria-label="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
      <div class="modal-body" id="adminModalBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-stack" id="toastStack"></div>

  <script src="js/admin.js"></script>
</body>
</html>
